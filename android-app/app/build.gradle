plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mplayer'
    compileSdk 34
    ndkVersion '30.0.14904198'

    defaultConfig {
        applicationId "com.mplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
